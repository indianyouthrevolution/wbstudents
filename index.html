  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body {
      background-color: #02050D;
      color: #F1F5F9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      padding-bottom: 70px; /* Space for bottom mobile nav */
    }
    @media (min-width: 1024px) {
      body { padding-bottom: 0px; }
    }
    .neon-mesh-bg {
      background: 
        radial-gradient(circle at 10% 10%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(255, 184, 0, 0.07) 0%, transparent 45%),
        #02050D;
    }
    .glass-box {
      background: linear-gradient(135deg, rgba(8, 20, 38, 0.9) 0%, rgba(4, 11, 23, 0.98) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(21, 41, 69, 0.85);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .glass-box:hover {
      border-color: rgba(0, 240, 255, 0.45);
      box-shadow: 0 12px 30px -10px rgba(0, 240, 255, 0.25);
      transform: translateY(-4px);
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #FFE27A 0%, #FFB800 50%, #FFA000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .teal-gradient-text {
      background: linear-gradient(135deg, #E0FFFF 0%, #00F0FF 50%, #00A3B4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes slideUpFade {
      0% { opacity: 0; transform: translateY(40px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-slide-up { animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes marqueeRight {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0%); }
    }
    @keyframes marqueeLeft {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    .anim-marquee-right { display: flex; width: max-content; animation: marqueeRight 55s linear infinite; }
    .anim-marquee-left { display: flex; width: max-content; animation: marqueeLeft 35s linear infinite; }
    .marquee-wrapper:hover .anim-marquee-right,
    .marquee-wrapper:hover .anim-marquee-left { animation-play-state: paused; }

    /* Circular Orbit CSS */
    @keyframes orbitRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes counterRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    .solar-system {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .solar-system:hover .orbit-path,
    .solar-system:hover .orbit-planet,
    .solar-system:hover .orbit-planet span { animation-play-state: paused !important; }

    .orbit-planet { z-index: 20; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

    ];

    const WB_DISTRICTS = [
      'Alipurduar', 'Bankura', 'Birbhum', 'Cooch Behar', 'Dakshin Dinajpur',
      'Darjeeling', 'Hooghly', 'Howrah', 'Jalpaiguri', 'Jhargram',
      'Kalimpong', 'Kolkata', 'Malda', 'Murshidabad', 'Nadia',
      'North 24 Parganas', 'Paschim Bardhaman', 'Paschim Medinipur',
      'Purba Bardhaman', 'Purba Medinipur', 'Purulia', 'South 24 Parganas',
      'Uttar Dinajpur', 'Outside West Bengal'
    ];

    const CONTRIBUTION_AREAS = [
      '👑 Become Group Admin (Lead a WhatsApp Group)',
      '📚 Provide Study Notes & Suggestions',
      '👨‍🏫 Be an Online / Offline Teacher & Doubt Solver',
      '🔍 Search & Organize Study Materials',
      '🤝 Student Welfare & District Helpline Desk',
      '🚀 Technical, Video & App Moderation'
    ];

    const getStored = (key, fallback) => {
      try { const d = localStorage.getItem(key); return d ? JSON.parse(d) : fallback; } catch (e) { return fallback; }
    };
    const setStored = (key, val) => {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    };

    let storedMembers = getStored('wbstg_members', INITIAL_MEMBERS);
    if(storedMembers.length < 5) storedMembers = INITIAL_MEMBERS; // Force update new members if missing

    const urlParams = new URLSearchParams(window.location.search);
    const initialViewParam = urlParams.get('view') || 'home';

    // ==========================================
    // 🔄 3. STATE MANAGEMENT & FIREBASE SYNC
    // ==========================================
    window.state = {
      users: [], 
      members: storedMembers,
      applications: getStored('wbstg_apps', []),
      waGroups: getStored('wbstg_wa_groups', INITIAL_WA_GROUPS),
      tasks: getStored('wbstg_tasks', INITIAL_TASKS),
      taskSubmissions: getStored('wbstg_task_subs', {}),
      socials: getStored('wbstg_socials', INITIAL_SOCIALS),
      notifications: getStored('wbstg_notifs', []),
      currentUser: getStored('wbstg_user', null),
      currentView: initialViewParam,
      adminTab: 'overview',
      showStatusSection: true,
      showTasksSection: true
    };

    // ONLY REAL-TIME SYNC TO PREVENT CONFLICTS
    window.initFirebaseSync = function() {
      if (!db) return;

      const syncCol = (colName, stateKey, sortKey) => {
        db.collection(colName).onSnapshot(snap => {
          const arr = [];
          snap.forEach(doc => arr.push(doc.data()));
          
          if(sortKey) {
            arr.sort((a,b) => (b[sortKey] || 0) - (a[sortKey] || 0));
          }
          
          if(arr.length > 0) {
            window.state[stateKey] = arr;
          }
          window.renderMain(); // Auto-render UI when DB changes
        }, err => console.error(`Error syncing ${colName}:`, err));
      };

      syncCol("users", "users", "createdAt");
      syncCol("applications", "applications", "submittedAt");
      syncCol("notifications", "notifications", "timestamp");
      syncCol("members", "members", "order");
    };

    if (db) { window.initFirebaseSync(); }

    window.dbSave = function(collection, id, data) {
      if (db) {
        db.collection(collection).doc(id).set(data, { merge: true })
          .then(() => console.log(`Saved to ${collection} DB`))
          .catch(console.error);
      }
    };

    window.dbDelete = function(collection, id) {
      if (db) db.collection(collection).doc(id).delete().catch(console.error);
    };

    window.saveState = function(firebaseDataUpdate = false, type = null, data = null) {
      setStored('wbstg_members', window.state.members);
      setStored('wbstg_apps', window.state.applications);
      setStored('wbstg_wa_groups', window.state.waGroups);
      setStored('wbstg_tasks', window.state.tasks);
      setStored('wbstg_task_subs', window.state.taskSubmissions);
      setStored('wbstg_socials', window.state.socials);
      setStored('wbstg_notifs', window.state.notifications);
      setStored('wbstg_user', window.state.currentUser);

      if (db && firebaseDataUpdate && type && data) {
        window.dbSave(type, data.id, data);
      }

      window.renderNav();
      window.renderMain();
      window.renderFooterSocials();
      window.updateBottomNavUI();
    };

    // ==========================================
    // 🛠️ 4. HELPER FUNCTIONS & ROUTING
    // ==========================================
    window.generateApprovedMemberId = function(name) {
      const cleanName = (name || 'Member').trim().toUpperCase();
      const firstLetter = cleanName.charAt(0) || 'X';
      return `IYR ${firstLetter}${Math.floor(10 + Math.random() * 90)}`;
    };

    window.generateTrackingId = function(name, phone) {
      const cleanName = (name || 'STU').trim().split(' ')[0].toUpperCase().replace(/[^A-Z]/g, '');
      const digits = (phone || '0000').replace(/[^0-9]/g, '');
      const lastFour = digits.length >= 4 ? digits.slice(-4) : digits.padStart(4, '0');
      return `${cleanName}${lastFour}`;
    };

    window.getDefaultAvatarHtml = function(name, gender, sizeClass = "w-full h-full") {
      const initial = (name || 'U').charAt(0).toUpperCase();
      const bgGradient = gender === 'Female' ? 'from-pink-500 to-rose-600' : 'from-cyan-500 to-blue-600';
      return `<div class="${sizeClass} bg-gradient-to-br ${bgGradient} text-white font-black flex items-center justify-center text-2xl shadow-inner select-none">${initial}</div>`;
    };

    window.switchView = function(view) {
      window.state.currentView = view;
      try {
        const newUrl = view === 'home' ? window.location.pathname : `?view=${view}`;
        window.history.pushState({ view: view }, '', newUrl);
      } catch (e) {
        window.location.hash = view;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      window.renderNav();
      window.renderMain();
      window.updateBottomNavUI();
    };

    window.addEventListener('popstate', function(event) {
      const urlParams = new URLSearchParams(window.location.search);
      window.state.currentView = urlParams.get('view') || window.location.hash.replace('#','') || 'home';
      window.renderNav();
      window.renderMain();
      window.updateBottomNavUI();
    });

    window.updateBottomNavUI = function() {
      const view = window.state.currentView;
      const navs = ['home', 'study', 'store', 'updates', 'foryou'];
      navs.forEach(nav => {
        const el = document.getElementById(`bottom-${nav}`);
        if(el) {
          if (nav === view) el.className = "flex flex-col items-center gap-1 text-brand-teal text-[10px] font-bold transition";
          else el.className = "flex flex-col items-center gap-1 text-slate-400 hover:text-brand-teal text-[10px] font-semibold transition";
        }
      });
    }

    // ==========================================
    // 🎨 5. UI RENDERERS
    // ==========================================
    window.renderFooterSocials = function() {
      const footerBox = document.getElementById('footer-social-links');
      if (!footerBox) return;
      footerBox.innerHTML = window.state.socials.map(s => `
        <a href="${s.url}" target="_blank" class="text-brand-gold hover:underline font-bold flex items-center gap-1.5 transition hover:text-white">
          <span>${s.icon || '🔗'}</span> ${s.name}
        </a>
      `).join(' • ');
    };

    window.renderNav = function() {
      const authBox = document.getElementById('auth-actions');
      const isAdmin = window.state.currentUser && window.state.currentUser.email && window.state.currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();

      const homeBtn = document.getElementById('nav-home-btn');
      const memBtn = document.getElementById('nav-mem-btn');
      const studyBtn = document.getElementById('nav-study-btn');
      if (homeBtn) homeBtn.className = window.state.currentView === 'home' ? 'text-brand-teal font-extrabold transition' : 'text-slate-300 hover:text-white transition';
      if (memBtn) memBtn.className = window.state.currentView === 'membership' ? 'text-brand-teal font-extrabold transition' : 'text-slate-300 hover:text-white transition';
      if (studyBtn) studyBtn.className = window.state.currentView === 'study' ? 'text-brand-gold font-extrabold transition' : 'text-brand-gold hover:text-brand-goldLight transition';

      if (window.state.currentUser) {
        const firstLetter = (window.state.currentUser.name || 'U').charAt(0).toUpperCase();
        authBox.innerHTML = `
          <div class="flex items-center gap-2">
            ${isAdmin ? `
              <button onclick="window.switchView('admin')" class="px-3 py-1.5 bg-brand-gold/15 text-brand-gold border border-brand-gold/40 rounded-xl text-xs font-black hover:bg-brand-gold hover:text-brand-black transition shadow">
                🛡️ Admin
              </button>
            ` : ''}
            <button onclick="window.switchView('foryou')" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 text-white font-black text-sm flex items-center justify-center shadow-lg hover:ring-2 hover:ring-brand-teal transition" title="${window.state.currentUser.name}">
              ${firstLetter}
            </button>
          </div>
        `;
      } else {
        authBox.innerHTML = `
          <button onclick="window.openAuthModal()" class="px-4 py-2 bg-brand-teal/15 hover:bg-brand-teal/25 text-brand-teal border border-brand-teal/40 rounded-xl text-xs font-black transition shadow-lg">
            Sign In
          </button>
        `;
      }
    };

    window.renderMain = function() {
      const container = document.getElementById('main-content');
      if (!container) return;
      const v = window.state.currentView;
      
      if (v === 'admin') window.renderAdminPage(container);
      else if (v === 'membership') window.renderMembershipPage(container);
      else if (v === 'study') window.renderStudyPage(container);
      else if (v === 'store') window.renderStorePage(container);
      else if (v === 'updates') window.renderUpdatesPage(container);
      else if (v === 'foryou') window.renderForYouPage(container);
      else window.renderHomePage(container);
    };

    window.toggleLeadGroupDropdown = function(isChecked) {
      const box = document.getElementById('lead-group-container');
      if (isChecked) box.classList.remove('hidden');
      else box.classList.add('hidden');
    };

    window.uploadedPhotoUrl = "";
    window.handlePhotoUpload = function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onloadend = () => {
          window.uploadedPhotoUrl = reader.result;
          document.getElementById('photo-preview-box').innerHTML = `<img src="${window.uploadedPhotoUrl}" class="w-full h-full object-cover" />`;
        };
        reader.readAsDataURL(file);
      }
    };

    window.handleMembershipSubmit = function(e) {
      e.preventDefault();
      const agreed = document.getElementById('app-agree-rules').checked;
      if (!agreed) {
        alert("Please accept the code of conduct and rules to proceed.");
        return;
      }

      const checkedContribs = Array.from(document.querySelectorAll('input[name="contrib"]:checked')).map(c => c.value);
      const wantToLeadGroup = document.getElementById('lead-group-checkbox').checked;
      const targetLeadGroup = wantToLeadGroup ? document.getElementById('app-lead-target-group').value : 'None';

      if (checkedContribs.length === 0 && !wantToLeadGroup) {
        alert("Please select at least one area of contribution or select group leadership.");
        return;
      }

      const name = document.getElementById('app-name').value;
      const gender = document.getElementById('app-gender').value;
      const age = document.getElementById('app-age').value;
      const district = document.getElementById('app-district').value;
      const whatsapp = document.getElementById('app-whatsapp').value;
      const email = document.getElementById('app-email').value;
      const education = document.getElementById('app-education').value;

      const skills = document.getElementById('app-skills').value;
      const whyJoin = document.getElementById('app-why-join').value;
      const howHelp = document.getElementById('app-how-help').value;
      const workPref = document.getElementById('app-work-pref').value;
      const allowDm = document.getElementById('app-allow-dm').value;
      const allowCalls = document.getElementById('app-allow-calls').value;

      const trackingId = window.generateTrackingId(name, whatsapp);

      const app = {
        id: 'app-' + Date.now(),
        trackingId: trackingId,
        memberId: null,
        fullName: name,
        gender: gender,
        age: age,
        district: district,
        whatsapp: whatsapp,
        email: email,
        education: education,
        skills: skills || 'N/A',
        whyJoin: whyJoin,
        howHelp: howHelp,
        wantToLeadGroup: wantToLeadGroup,
        targetLeadGroup: targetLeadGroup,
        workPreference: workPref,
        allowDm: allowDm,
        allowCalls: allowCalls,
        contributions: checkedContribs,
        photoUrl: window.uploadedPhotoUrl || "", 
        status: 'under_review',
        rejectionReason: '',
        submittedAt: Date.now()
      };

      window.state.applications.unshift(app);
      window.saveState(true, 'applications', app); // Using Firebase
      window.openTrackSuccessModal(app);
    };

    window.adminApproveApp = function(id) {
      const app = window.state.applications.find(a => a.id === id);
      if (app) {
        app.status = 'approved';
        app.memberId = window.generateApprovedMemberId(app.fullName);
        window.saveState(true, 'applications', app);
        alert("Application Approved and Member ID issued!");
      }
    };

    window.adminPromptReject = function(id) {
      const reason = prompt("Enter the reason for rejection (this will be shown to the user):");
      if (reason !== null && reason.trim() !== '') {
        const app = window.state.applications.find(a => a.id === id);
        if (app) {
          app.status = 'not_selected';
          app.rejectionReason = reason;
          window.saveState(true, 'applications', app);
        }
      }
    };

    window.handleAddLeader = function(e) {
      e.preventDefault();
      const name = document.getElementById('new-lead-name').value;
      const role = document.getElementById('new-lead-role').value;
      const badge = document.getElementById('new-lead-badge').value;
      const district = document.getElementById('new-lead-district').value;
      const photo = document.getElementById('new-lead-photo').value;
      const bio = document.getElementById('new-lead-bio').value;

      const leaderData = {
        id: 'mem-' + Date.now(),
        memberId: window.generateApprovedMemberId(name),
        name, role, badge, district,
        phone: '',
        showPhone: false,
        bio: bio || "Dedicated student volunteer.",
        joinedDate: "August 2026",
        photoUrl: photo || "",
        order: window.state.members.length + 1
      };

      window.state.members.push(leaderData);
      window.saveState(true, 'members', leaderData);
      alert("Leader published to Directory!");
    };

    window.handleEditLeader = function(id) {
      const leader = window.state.members.find(m => m.id === id);
      if(!leader) return;
      const newRole = prompt("Update Role / Designation for " + leader.name + ":", leader.role);
      if(newRole !== null && newRole.trim() !== '') {
        leader.role = newRole.trim();
        window.saveState(true, 'members', leader);
        alert("Leader role updated!");
      }
    };

    window.handleDeleteLeader = function(id) {
      if(confirm("Are you sure you want to remove this leader from the directory?")) {
        window.state.members = window.state.members.filter(m => m.id !== id);
        window.dbDelete('members', id);
        window.saveState();
      }
    };

    window.handleSendNotification = function(e) {
      e.preventDefault();
      const target = document.getElementById('notif-target').value;
      const title = document.getElementById('notif-title').value;
      const message = document.getElementById('notif-msg').value;
      const link = document.getElementById('notif-link').value;

      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      const timeString = `${hours}:${minutes} ${ampm}`;
      const dateString = now.toISOString().split('T')[0];
      const timestamp = Date.now();

      const notifData = {
        id: 'notif-' + timestamp,
        target,
        title,
        message,
        link: link || null,
        date: dateString,
        time: timeString,
        timestamp: timestamp
      };

      window.state.notifications.unshift(notifData);
      window.saveState(true, 'notifications', notifData);
      
      alert("Notification sent successfully!");
      document.getElementById('notif-title').value = '';
      document.getElementById('notif-msg').value = '';
      document.getElementById('notif-link').value = '';
    };

              <div>
                <label class="text-[10px] font-bold text-slate-300 block mb-1">WHATSAPP NUMBER</label>
                <input type="tel" id="edit-phone" value="${window.state.currentUser.phone || ''}" placeholder="10-digit number" class="w-full bg-brand-card border border-brand-border rounded-xl px-3.5 py-2.5 text-xs text-white outline-none" />
              </div>
              <div>
                <label class="text-[10px] font-bold text-slate-300 block mb-1">DISTRICT</label>
                <select id="edit-district" class="w-full bg-brand-card border border-brand-border rounded-xl px-3.5 py-2.5 text-xs text-white outline-none">
                  ${WB_DISTRICTS.map(d => `<option value="${d}" ${d === window.state.currentUser.district ? 'selected' : ''}>${d}</option>`).join('')}
                </select>
              </div>
              <button type="submit" class="w-full py-3 bg-brand-teal hover:bg-cyan-300 text-brand-black font-black rounded-xl text-xs transition shadow-lg mt-4">Save Changes</button>
            </form>
          </div>
        </div>
      `;
    };

    window.handleProfileSave = function(e) {
      e.preventDefault();
      window.state.currentUser.name = document.getElementById('edit-name').value;
      window.state.currentUser.phone = document.getElementById('edit-phone').value;
      window.state.currentUser.district = document.getElementById('edit-district').value;
      
      if (window.state.currentUser.id) {
        window.dbSave("users", window.state.currentUser.id, window.state.currentUser);
      }
      
      window.saveState();
      window.closeModal();
      alert("Profile updated successfully!");
    };

    window.openTrackModal = function() {
      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
          <div class="relative w-full max-w-md bg-brand-dark border border-brand-border p-6 rounded-3xl shadow-2xl">
            <button onclick="window.closeModal()" class="absolute top-4 right-4 p-2 bg-brand-card rounded-full text-slate-400">✕</button>
            <h3 class="text-xl font-black text-white mb-2">Track Application</h3>
            <form onsubmit="window.handleTrackSearch(event)" class="flex gap-2 mb-4 text-xs">
              <input type="text" id="track-query" required placeholder="Enter Tracking ID or Email" class="flex-1 bg-brand-card border border-brand-border rounded-xl p-3 text-white outline-none" />
              <button type="submit" class="px-4 bg-brand-teal text-brand-black font-bold rounded-xl">Track</button>
            </form>
            <div id="track-result-box"></div>
          </div>
        </div>
      `;
    };

    window.handleTrackSearch = function(e) {
      e.preventDefault();
      const q = document.getElementById('track-query').value.trim().toLowerCase();
      const match = window.state.applications.find(a => a.trackingId.toLowerCase().includes(q) || a.email.toLowerCase().includes(q));
      const box = document.getElementById('track-result-box');
      if (match) {
        box.innerHTML = `
          <div class="bg-brand-card p-4 rounded-xl border border-brand-border text-xs space-y-2 text-left">
            <div>Name: <strong class="text-white">${match.fullName}</strong></div>
            <div>Status: <strong class="text-brand-gold">${match.status.toUpperCase()}</strong></div>
            ${match.status === 'not_selected' ? `<div class="text-rose-400">Reason: ${match.rejectionReason}</div>` : ''}
          </div>
        `;
      } else {
        box.innerHTML = `<p class="text-rose-400 text-xs text-center py-2">No application found.</p>`;
      }
    };

    window.openMemberModal = function(id) {
      const m = window.state.members.find(x => x.id === id);
      if (!m) return;
      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
          <div class="relative w-full max-w-xl bg-brand-dark border border-brand-border rounded-3xl p-6 shadow-2xl animate-slide-up">
            <button onclick="window.closeModal()" class="absolute top-4 right-4 p-2 bg-brand-card rounded-full text-slate-400 hover:text-white">✕</button>
            <div class="flex flex-col sm:flex-row gap-6 items-center sm:items-start">
              <div class="w-40 aspect-[4/5] rounded-2xl overflow-hidden flex-shrink-0 border-2 border-brand-teal">
                ${m.photoUrl ? `<img src="${m.photoUrl}" alt="${m.name}" class="w-full h-full object-cover object-top" />` : window.getDefaultAvatarHtml(m.name, 'Male', 'w-full h-full')}
              </div>
              <div class="flex-1 text-center sm:text-left">
                <span class="text-brand-gold text-[10px] font-black uppercase tracking-widest">${m.badge}</span>
                <h3 class="text-2xl font-black text-white mt-0.5">${m.name}</h3>
                <p class="text-brand-teal text-xs font-bold mb-3">${m.role}</p>
                <p class="text-xs text-slate-400 mb-4 font-mono">ID: ${m.memberId} • District: ${m.district}</p>
                <div class="bg-brand-card p-3.5 rounded-xl text-xs text-slate-300 leading-relaxed border border-brand-border">${m.bio}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    };

    // INIT APP
    window.saveState();

  </script>
</body>
</html>
