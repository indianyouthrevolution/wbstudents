    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

      overflow-x: hidden;

    .neon-mesh-bg {
      background: 
        radial-gradient(circle at 10% 10%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(255, 184, 0, 0.07) 0%, transparent 45%),
        #02050D;
    }
    .glass-box {
      background: linear-gradient(135deg, rgba(8, 20, 38, 0.9) 0%, rgba(4, 11, 23, 0.98) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(21, 41, 69, 0.85);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .glass-box:hover {
      border-color: rgba(0, 240, 255, 0.45);
      box-shadow: 0 12px 30px -10px rgba(0, 240, 255, 0.25);
      transform: translateY(-4px);
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #FFE27A 0%, #FFB800 50%, #FFA000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .teal-gradient-text {
      background: linear-gradient(135deg, #E0FFFF 0%, #00F0FF 50%, #00A3B4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes slideUpFade {
      0% { opacity: 0; transform: translateY(40px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-slide-up {
      animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
      50% { box-shadow: 0 0 30px rgba(0, 240, 255, 0.7); }
    }
    .animate-pulse-glow {
      animation: pulseGlow 2.5s infinite;
    }
    
    @keyframes marqueeRight {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0%); }
    }
    @keyframes marqueeLeft {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .anim-marquee-right {
      display: flex;
      width: max-content;
      animation: marqueeRight 55s linear infinite;
    }
    .anim-marquee-left {
      display: flex;
      width: max-content;
      animation: marqueeLeft 35s linear infinite;
    }
    .marquee-wrapper:hover .anim-marquee-right,
    .marquee-wrapper:hover .anim-marquee-left {
      animation-play-state: paused;
    }
    .anim-float {
      animation: floatSlow 5s ease-in-out infinite;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

      const lastFour = digits.length >= 4 ? digits.slice(-4) : digits.padStart(4, '0');

    window.handlePhotoUpload = function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onloadend = () => {
          window.uploadedPhotoUrl = reader.result;
          document.getElementById('photo-preview-box').innerHTML = `<img src="${window.uploadedPhotoUrl}" class="w-full h-full object-cover" />`;
        };
        reader.readAsDataURL(file);
      }
    };

    window.handleMembershipSubmit = function(e) {
      e.preventDefault();
      const agreed = document.getElementById('app-agree-rules').checked;
      if (!agreed) {
        alert("Please accept the code of conduct and rules to proceed.");
        return;
      }

      const checkedContribs = Array.from(document.querySelectorAll('input[name="contrib"]:checked')).map(c => c.value);
      const wantToLeadGroup = document.getElementById('lead-group-checkbox').checked;
      const targetLeadGroup = wantToLeadGroup ? document.getElementById('app-lead-target-group').value : 'None';

      if (checkedContribs.length === 0 && !wantToLeadGroup) {
        alert("Please select at least one area of contribution or select group leadership.");
        return;
      }

      const name = document.getElementById('app-name').value;
      const gender = document.getElementById('app-gender').value;
      const age = document.getElementById('app-age').value;
      const district = document.getElementById('app-district').value;
      const whatsapp = document.getElementById('app-whatsapp').value;
      const email = document.getElementById('app-email').value;
      const education = document.getElementById('app-education').value;

      const skills = document.getElementById('app-skills').value;
      const whyJoin = document.getElementById('app-why-join').value;
      const howHelp = document.getElementById('app-how-help').value;
      const workPref = document.getElementById('app-work-pref').value;
      const allowDm = document.getElementById('app-allow-dm').value;
      const allowCalls = document.getElementById('app-allow-calls').value;

      const trackingId = window.generateTrackingId(name, whatsapp);

      const app = {
        id: 'app-' + Date.now(),
        trackingId: trackingId,
        memberId: null,
        fullName: name,
        gender: gender,
        age: age,
        district: district,
        whatsapp: whatsapp,
        email: email,
        education: education,
        skills: skills || 'N/A',
        whyJoin: whyJoin,
        howHelp: howHelp,
        wantToLeadGroup: wantToLeadGroup,
        targetLeadGroup: targetLeadGroup,
        workPreference: workPref,
        allowDm: allowDm,
        allowCalls: allowCalls,
        contributions: checkedContribs,
        photoUrl: window.uploadedPhotoUrl || "", 
        status: 'under_review',
        submittedAt: Date.now()
      };

      window.state.applications.unshift(app);
      window.saveState();
      window.openTrackSuccessModal(app);
    };

    window.downloadIdCardCanvas = async function(appId) {
      const app = window.state.applications.find(a => a.id === appId);
      if (!app || !app.memberId) return;

      const canvas = document.createElement('canvas');
      canvas.width = 1200;
      canvas.height = 700;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 1200, 700);
      grad.addColorStop(0, '#02050D');
      grad.addColorStop(0.5, '#050D1A');
      grad.addColorStop(1, '#081426');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1200, 700);

      ctx.strokeStyle = '#00F0FF';
      ctx.lineWidth = 6;
      ctx.strokeRect(30, 30, 1140, 640);
      ctx.strokeStyle = '#FFB800';
      ctx.lineWidth = 2;
      ctx.strokeRect(40, 40, 1120, 620);

      // Header Text
      ctx.fillStyle = '#00F0FF';
      ctx.font = 'bold 36px sans-serif';
      ctx.fillText('WB STUDENTS GROUP', 90, 105);

      ctx.fillStyle = '#94A3B8';
      ctx.font = '600 18px sans-serif';
      ctx.fillText('OFFICIAL VERIFIED STATE EXECUTIVE ID PASS', 90, 138);

      ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(90, 165);
      ctx.lineTo(1110, 165);
      ctx.stroke();

      ctx.fillStyle = '#FFB800';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('ASSIGNED ROLE / GROUP ADMIN', 90, 215);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 28px sans-serif';
      const roleText = app.wantToLeadGroup ? `GROUP ADMIN: ${app.targetLeadGroup.toUpperCase()}` : 'STATE VOLUNTEER & MEMBER';
      ctx.fillText(roleText, 90, 255);

      ctx.fillStyle = '#94A3B8';
      ctx.font = '18px sans-serif';
      ctx.fillText('FULL NAME', 90, 315);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 28px sans-serif';
      ctx.fillText(app.fullName, 90, 350);

      ctx.fillStyle = '#94A3B8';
      ctx.font = '18px sans-serif';
      ctx.fillText('OFFICIAL MEMBER ID', 90, 410);
      ctx.fillStyle = '#00F0FF';
      ctx.font = 'bold 26px monospace';
      ctx.fillText(app.memberId, 90, 445);

      ctx.fillStyle = '#94A3B8';
      ctx.font = '18px sans-serif';
      ctx.fillText('DISTRICT / REGION', 90, 505);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText(app.district, 90, 540);

      // Verified Badge Stamp
      ctx.fillStyle = '#FFB800';
      ctx.beginPath();
      ctx.arc(670, 470, 45, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#02050D';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('VERIFIED', 670, 465);
      ctx.fillText('STG 2026', 670, 485);
      ctx.textAlign = 'left';

      ctx.fillStyle = '#64748B';
      ctx.font = '16px sans-serif';
      ctx.fillText(`WBSTG Learning Network • Helpline: ${OFFICIAL_WHATSAPP}`, 90, 620);

      // QR Code with branding
      try {
        const qr = qrcode(0, 'L');
        qr.addData(`https://wbstudentsgroup.github.io/Portal/verify?id=${app.memberId}`);
        qr.make();
        const tileW = 140 / qr.getModuleCount();
        const startX = 930;
        const startY = 320;

        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(startX - 10, startY - 10, 160, 160);

        ctx.fillStyle = '#02050D';
        for (let r = 0; r < qr.getModuleCount(); r++) {
          for (let c = 0; c < qr.getModuleCount(); c++) {
            if (qr.isDark(r, c)) {
              ctx.fillRect(startX + c * tileW, startY + r * tileW, tileW + 0.5, tileW + 0.5);
            }
          }
        }
        ctx.fillStyle = '#00F0FF';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText('SCAN TO VERIFY', startX + 15, startY + 180);
      } catch (err) {}

      // Load Logo and Avatar
      const logoImg = new Image();
      logoImg.crossOrigin = 'anonymous';
      logoImg.src = LOGO_URL;
      logoImg.onload = () => {
        ctx.drawImage(logoImg, 90, 60, 40, 40);

        if (app.photoUrl) {
          const photoImg = new Image();
          photoImg.crossOrigin = 'anonymous';
          photoImg.src = app.photoUrl;
          photoImg.onload = () => {
            ctx.save();
            ctx.beginPath();
            ctx.arc(770, 350, 130, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(photoImg, 640, 220, 260, 260);
            ctx.restore();

            ctx.strokeStyle = '#00F0FF';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(770, 350, 130, 0, Math.PI * 2);
            ctx.stroke();
            triggerDownload(canvas);
          };
          photoImg.onerror = () => {
            drawDefaultAvatarOnCanvas(ctx, app);
            triggerDownload(canvas);
          };
        } else {
          drawDefaultAvatarOnCanvas(ctx, app);
          triggerDownload(canvas);
        }
      };
      logoImg.onerror = () => {
        triggerDownload(canvas);
      };
    };

    function drawDefaultAvatarOnCanvas(ctx, app) {
      ctx.fillStyle = '#1E293B';
      ctx.beginPath();
      ctx.arc(770, 350, 130, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#00F0FF';
      ctx.font = 'bold 64px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(app.fullName.charAt(0).toUpperCase(), 770, 372);
      ctx.textAlign = 'left';

      ctx.strokeStyle = '#00F0FF';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(770, 350, 130, 0, Math.PI * 2);
      ctx.stroke();
    }

    function triggerDownload(canvas) {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/jpeg', 0.95);
      a.download = `WBSTG_ID_CARD_${Date.now()}.jpg`;
      a.click();
    }

                  <textarea id="new-lead-bio" rows="2" placeholder="Responsibilities..." class="w-full bg-brand-card border border-brand-border rounded-xl p-2.5 text-xs text-white outline-none focus:border-brand-teal"></textarea>
                </div>
                <button type="submit" class="w-full py-2.5 bg-brand-teal text-brand-black font-bold rounded">Publish to Directory</button>
              </form>
            </div>

            <div class="lg:col-span-7 space-y-2">
              <h4 class="text-xs font-bold text-slate-400 uppercase mb-2">Live Verified Leaders (${window.state.members.length})</h4>
              ${window.state.members.map(m => `
                <div class="glass-box p-3.5 rounded-xl flex justify-between items-center text-xs">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl overflow-hidden flex-shrink-0">
                      ${m.photoUrl ? `<img src="${m.photoUrl}" class="w-full h-full object-cover" />` : window.getDefaultAvatarHtml(m.name, 'Male', 'w-full h-full')}
                    </div>
                    <div>
                      <div class="font-bold text-white">${m.name}</div>
                      <div class="text-[10px] text-brand-teal">${m.role} • <span class="font-mono text-brand-gold">${m.memberId}</span></div>
                    </div>
                  </div>
                  <button onclick="window.handleDeleteLeader('${m.id}')" class="text-rose-400 hover:text-rose-300 p-1.5 font-bold">
                    🗑️
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;

      return '';
    };

    // Admin Action Handlers
    window.adminApproveApp = function(id) {
      const app = window.state.applications.find(a => a.id === id);
      if (app) {
        app.status = 'approved';
        if (!app.memberId) {
          app.memberId = window.generateApprovedMemberId(app.fullName);
        }
        window.saveState();
      }
    };

    window.adminRejectApp = function(id) {
      const app = window.state.applications.find(a => a.id === id);
      if (app) {
        app.status = 'not_selected';
        window.saveState();
      }
    };

    window.handleAddTask = function(e) {
      e.preventDefault();
      const title = document.getElementById('new-task-title').value;
      const deadline = document.getElementById('new-task-deadline').value;
      window.state.tasks.push({ id: 'task-' + Date.now(), title, deadline });
      window.saveState();
      alert("Task published successfully!");
    };

    window.handleDeleteTask = function(id) {
      window.state.tasks = window.state.tasks.filter(t => t.id !== id);
      window.saveState();
    };

    window.handleAddSocial = function(e) {
      e.preventDefault();
      const name = document.getElementById('new-soc-name').value;
      const icon = document.getElementById('new-soc-icon').value;
      const url = document.getElementById('new-soc-url').value;
      window.state.socials.push({ id: 'soc-' + Date.now(), name, icon, url });
      window.saveState();
      alert("Social link added to footer!");
    };

    window.handleDeleteSocial = function(id) {
      window.state.socials = window.state.socials.filter(s => s.id !== id);
      window.saveState();
    };

    window.handleAddWaGroup = function(e) {
      e.preventDefault();
      const title = document.getElementById('new-wa-title').value;
      const tag = document.getElementById('new-wa-tag').value;
      const sub = document.getElementById('new-wa-sub').value;
      const link = document.getElementById('new-wa-link').value;
      window.state.waGroups.push({ id: 'wa-' + Date.now(), title, tag: tag.toUpperCase(), subtitle: sub, link });
      window.saveState();
      alert("WhatsApp Group published!");
    };

    window.handleDeleteWaGroup = function(id) {
      window.state.waGroups = window.state.waGroups.filter(g => g.id !== id);
      window.saveState();
    };

    window.handleAddLeader = function(e) {
      e.preventDefault();
      const name = document.getElementById('new-lead-name').value;
      const role = document.getElementById('new-lead-role').value;
      const badge = document.getElementById('new-lead-badge').value;
      const district = document.getElementById('new-lead-district').value;
      const photo = document.getElementById('new-lead-photo').value;
      const bio = document.getElementById('new-lead-bio').value;

      window.state.members.push({
        id: 'mem-' + Date.now(),
        memberId: window.generateApprovedMemberId(name),
        name, role, badge, district,
        phone: OFFICIAL_WHATSAPP,
        showPhone: true,
        bio: bio || "Dedicated student volunteer.",
        joinedDate: "Present",
        photoUrl: photo || "",
        order: window.state.members.length + 1
      });
      window.saveState();
      alert("Leader published!");
    };

    window.handleDeleteLeader = function(id) {
      window.state.members = window.state.members.filter(m => m.id !== id);
      window.saveState();
    };

    window.exportAdminCSV = function() {
      const headers = ['Tracking ID,Member ID,Full Name,Gender,Age,District,WhatsApp,Email,Lead Group,Skills,Status\n'];
      const rows = window.state.applications.map(a => `"${a.trackingId}","${a.memberId || 'N/A'}","${a.fullName}","${a.gender || 'N/A'}","${a.age || 'N/A'}","${a.district}","${a.whatsapp}","${a.email}","${a.targetLeadGroup || 'None'}","${a.skills || 'N/A'}","${a.status}"\n`);
      const blob = new Blob([...headers, ...rows], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `WBSTG_Applications_${Date.now()}.csv`;
      a.click();
    };

    // Modal Handlers
    window.closeModal = function() {
      document.getElementById('modal-container').innerHTML = '';
    };

    window.openAuthModal = function() {
      window.isLoginMode = true;
      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
          <div class="relative w-full max-w-sm bg-brand-dark border border-brand-border p-6 rounded-3xl shadow-2xl animate-slide-up">
            <button onclick="window.closeModal()" class="absolute top-4 right-4 p-2 bg-brand-card rounded-full text-slate-400 hover:text-white">✕</button>

            <div class="flex bg-brand-card p-1 rounded-xl border border-brand-border mb-5">
              <button onclick="window.toggleAuthTab(true)" id="tab-login" class="flex-1 py-2 text-xs font-black rounded-lg bg-brand-teal text-brand-black shadow-lg">Sign In</button>
              <button onclick="window.toggleAuthTab(false)" id="tab-reg" class="flex-1 py-2 text-xs font-black rounded-lg text-slate-400">Create Account</button>
            </div>

            <div class="text-center mb-4">
              <h3 id="auth-heading" class="text-xl font-black text-white">Welcome Back!</h3>
              <p id="auth-sub" class="text-xs text-slate-400 mt-0.5">Enter your credentials to continue</p>
            </div>

            <form onsubmit="window.handleAuthSubmit(event)" class="space-y-3 text-left">
              <div id="extra-reg-fields" class="hidden space-y-3">
                <div>
                  <label class="text-[10px] font-bold text-slate-300 block mb-1">FULL NAME *</label>
                  <input type="text" id="auth-name" placeholder="Your Full Name" class="w-full bg-brand-card border border-brand-border rounded-xl px-3.5 py-2.5 text-xs text-white outline-none" />
                </div>
                <div>
                  <label class="text-[10px] font-bold text-slate-300 block mb-1">WHATSAPP NUMBER *</label>
                  <input type="tel" id="auth-phone" placeholder="10-digit number" class="w-full bg-brand-card border border-brand-border rounded-xl px-3.5 py-2.5 text-xs text-white outline-none" />
                </div>
                <div>
                  <label class="text-[10px] font-bold text-slate-300 block mb-1">DISTRICT *</label>
                  <select id="auth-district" class="w-full bg-brand-card border border-brand-border rounded-xl px-3.5 py-2.5 text-xs text-white outline-none">
                    ${WB_DISTRICTS.map(d => `<option value="${d}">${d}</option>`).join('')}
                  </select>
                </div>
              </div>

              <div>
                <label class="text-[10px] font-bold text-slate-300 block mb-1">EMAIL ADDRESS *</label>
                <input type="email" id="auth-email" required placeholder="name@email.com" class="w-full bg-brand-card border border-brand-border rounded-xl px-3.5 py-2.5 text-xs text-white outline-none" />
              </div>

              <div>
                <label class="text-[10px] font-bold text-slate-300 block mb-1">PASSWORD *</label>
                <input type="password" id="auth-pass" required placeholder="••••••••••••" class="w-full bg-brand-card border border-brand-border rounded-xl px-3.5 py-2.5 text-xs text-white outline-none" />
              </div>

              <button type="submit" id="auth-submit-btn" class="w-full py-3 bg-brand-teal hover:bg-cyan-300 text-brand-black font-black rounded-xl text-xs shadow-lg transition mt-4">
                Sign In to Portal
              </button>
            </form>

            <div class="relative my-4">
              <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-brand-border"></div></div>
              <div class="relative flex justify-center text-[9px] uppercase font-black text-slate-500 bg-brand-dark px-2">Quick 1-Click Access</div>
            </div>

            <button onclick="window.handleOneClickAdmin()" class="w-full py-2.5 bg-brand-gold/15 hover:bg-brand-gold text-brand-gold hover:text-brand-black font-black rounded-xl text-xs border border-brand-gold/30 transition flex items-center justify-center gap-1.5">
              🛡️ ⚡ Yusuf Khan (Master Admin 1-Click)
            </button>
          </div>
        </div>
      `;
    };

    window.toggleAuthTab = function(login) {
      window.isLoginMode = login;
      document.getElementById('tab-login').className = login ? 'flex-1 py-2 text-xs font-black rounded-lg bg-brand-teal text-brand-black shadow-lg' : 'flex-1 py-2 text-xs font-black rounded-lg text-slate-400';
      document.getElementById('tab-reg').className = !login ? 'flex-1 py-2 text-xs font-black rounded-lg bg-brand-gold text-brand-black shadow-lg' : 'flex-1 py-2 text-xs font-black rounded-lg text-slate-400';
      
      document.getElementById('auth-heading').innerText = login ? 'Welcome Back!' : 'Join WB Students Group';
      document.getElementById('auth-sub').innerText = login ? 'Enter your credentials to continue' : 'Create verified student account';
      document.getElementById('extra-reg-fields').className = login ? 'hidden space-y-3' : 'space-y-3';
      document.getElementById('auth-submit-btn').innerText = login ? 'Sign In to Portal' : 'Register Account';
      document.getElementById('auth-submit-btn').className = login ? 'w-full py-3 bg-brand-teal hover:bg-cyan-300 text-brand-black font-black rounded-xl text-xs shadow-lg transition mt-4' : 'w-full py-3 bg-brand-gold hover:bg-brand-goldLight text-brand-black font-black rounded-xl text-xs shadow-lg transition mt-4';
    };

    window.handleAuthSubmit = function(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-pass').value;

      if (email.toLowerCase() === ADMIN_EMAIL.toLowerCase() && pass === ADMIN_PASS) {
        window.state.currentUser = {
          name: "Yusuf Khan",
          email: ADMIN_EMAIL,
          phone: OFFICIAL_WHATSAPP,
          district: "Kolkata"
        };
        window.saveState();
        window.closeModal();
        window.switchView('admin');
        return;
      }

      if (window.isLoginMode) {
        window.state.currentUser = {
          name: email.split('@')[0],
          email: email,
          phone: "",
          district: "Kolkata"
        };
      } else {
        const name = document.getElementById('auth-name').value;
        const phone = document.getElementById('auth-phone').value;
        const district = document.getElementById('auth-district').value;
        window.state.currentUser = {
          name: name || email.split('@')[0],
          email: email,
          phone: phone,
          district: district
        };
      }

      window.saveState();
      window.closeModal();
    };

    window.handleOneClickAdmin = function() {
      window.state.currentUser = {
        name: "Yusuf Khan",
        email: ADMIN_EMAIL,
        phone: OFFICIAL_WHATSAPP,
        district: "Kolkata"
      };
      window.saveState();
      window.closeModal();
      window.switchView('admin');
    };

    window.handleLogout = function() {
      window.state.currentUser = null;
      window.state.currentView = 'home';
      window.saveState();
      window.closeModal();
    };

    window.openProfileModal = function() {
      const modal = document.getElementById('modal-container');
      const u = window.state.currentUser;
      const firstLetter = (u.name || 'U').charAt(0).toUpperCase();

      modal.innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
          <div class="relative w-full max-w-sm bg-brand-dark border border-brand-border p-6 rounded-3xl shadow-2xl text-center animate-slide-up">
            <button onclick="window.closeModal()" class="absolute top-4 right-4 p-2 bg-brand-card rounded-full text-slate-400 hover:text-white">✕</button>
            
            <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 text-white font-black text-2xl flex items-center justify-center mx-auto mb-3 shadow-xl ring-4 ring-brand-teal/30">
              ${firstLetter}
            </div>
            
            <h3 class="text-lg font-black text-white">${u.name}</h3>
            <p class="text-xs text-brand-teal font-mono mb-4">${u.email}</p>

            <div class="bg-brand-card p-3.5 rounded-2xl border border-brand-border text-xs text-left space-y-1.5 mb-6 text-slate-300">
              <div>District: <strong class="text-white">${u.district || 'Kolkata'}</strong></div>
              <div>WhatsApp: <strong class="text-white">${u.phone || 'Not Provided'}</strong></div>
            </div>

            <div class="space-y-2">
              <button onclick="window.closeModal(); window.openProfileEditForm();" class="w-full py-2.5 bg-brand-card hover:bg-brand-border text-slate-200 font-bold rounded-xl text-xs border border-brand-border transition">
                Edit Personal Info ✎
              </button>
              <button onclick="window.handleLogout()" class="w-full py-2.5 bg-rose-500/20 hover:bg-rose-500 text-rose-300 hover:text-white font-bold rounded-xl text-xs border border-rose-500/30 transition">
                Sign Out / Logout 🚪
              </button>
            </div>
          </div>
        </div>
      `;
    };

    window.openProfileEditForm = function() {
      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
          <div class="relative w-full max-w-sm bg-brand-dark border border-brand-border p-6 rounded-3xl shadow-2xl animate-slide-up">
            <button onclick="window.closeModal()" class="absolute top-4 right-4 p-2 bg-brand-card rounded-full text-slate-400 hover:text-white">✕</button>
            <h3 class="text-xl font-black text-white mb-1">Edit Profile</h3>
            <p class="text-xs text-slate-400 mb-4 font-mono">${window.state.currentUser.email}</p>

            <form onsubmit="window.handleProfileSave(event)" class="space-y-3.5 text-left">
              <div>
                <label class="text-[10px] font-bold text-slate-300 block mb-1">FULL NAME</label>
                <input type="text" id="edit-name" required value="${window.state.currentUser.name || ''}" class="w-full bg-brand-card border border-brand-border rounded-xl px-3.5 py-2.5 text-xs text-white outline-none" />
              </div>

              <div>
                <label class="text-[10px] font-bold text-slate-300 block mb-1">WHATSAPP NUMBER</label>
                <input type="tel" id="edit-phone" value="${window.state.currentUser.phone || ''}" placeholder="10-digit number" class="w-full bg-brand-card border border-brand-border rounded-xl px-3.5 py-2.5 text-xs text-white outline-none" />
              </div>

              <div>
                <label class="text-[10px] font-bold text-slate-300 block mb-1">DISTRICT</label>
                <select id="edit-district" class="w-full bg-brand-card border border-brand-border rounded-xl px-3.5 py-2.5 text-xs text-white outline-none">
                  ${WB_DISTRICTS.map(d => `<option value="${d}">${d}</option>`).join('')}

              </div>

                Save Changes
              </button>
            </form>
          </div>
        </div>
      `;
    };

    window.handleProfileSave = function(e) {
      e.preventDefault();
      window.state.currentUser.name = document.getElementById('edit-name').value;
      window.state.currentUser.phone = document.getElementById('edit-phone').value;
      window.state.currentUser.district = document.getElementById('edit-district').value;
      window.saveState();
      window.closeModal();
      alert("Profile updated successfully!");
    };

    window.openTrackModal = function() {
      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
          <div class="relative w-full max-w-md bg-brand-dark border border-brand-border p-6 rounded-3xl shadow-2xl animate-slide-up">
            <button onclick="window.closeModal()" class="absolute top-4 right-4 p-2 bg-brand-card rounded-full text-slate-400 hover:text-white">✕</button>
            <h3 class="text-xl font-black text-white mb-1">Track Membership Application</h3>
            <p class="text-xs text-slate-400 mb-4">Enter Tracking ID, Phone or Email</p>

            <form onsubmit="window.handleTrackSearch(event)" class="flex gap-2 mb-4">
              <input type="text" id="track-query" required placeholder="e.g. YUSUF4041, phone, email" class="flex-1 bg-brand-card border border-brand-border rounded-xl px-4 py-3 text-xs text-white" />
              <button type="submit" class="px-5 bg-brand-teal text-brand-black font-bold text-xs rounded-xl">Track</button>
            </form>

            <div id="track-result-box"></div>
          </div>
        </div>
      `;
    };

    window.handleTrackSearch = function(e) {
      e.preventDefault();
      const q = document.getElementById('track-query').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
      const match = window.state.applications.find(a => {
        const trackMatch = (a.trackingId || '').toLowerCase().replace(/[^a-z0-9]/g, '').includes(q);
        const phoneMatch = (a.whatsapp || '').replace(/[^0-9]/g, '').includes(q);
        const emailMatch = (a.email || '').toLowerCase().includes(q);
        const memMatch = (a.memberId || '').toLowerCase().replace(/[^a-z0-9]/g, '').includes(q);
        return trackMatch || phoneMatch || emailMatch || memMatch;
      });

      const box = document.getElementById('track-result-box');
      if (match) {
        box.innerHTML = `
          <div class="bg-brand-card p-4 rounded-xl border border-brand-border text-xs space-y-3">
            <div class="flex justify-between items-center pb-2 border-b border-brand-border">
              <span class="font-bold text-white text-sm">${match.fullName}</span>
              <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${match.status === 'approved' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-brand-gold'}">
                ${match.status.toUpperCase()}
              </span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-[11px]">
              <div><span class="text-slate-500 block text-[9px]">TRACKING ID</span><strong class="text-white font-mono">${match.trackingId}</strong></div>
              <div><span class="text-slate-500 block text-[9px]">OFFICIAL MEMBER ID</span><strong class="text-brand-gold font-mono">${match.memberId || 'Pending Approval'}</strong></div>
            </div>
          </div>
        `;
      } else {
        box.innerHTML = `<p class="text-rose-400 text-xs text-center py-4">No application found.</p>`;
      }
    };

    window.openTrackSuccessModal = function(app) {
      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
          <div class="relative w-full max-w-md bg-brand-dark border border-brand-border p-6 rounded-3xl shadow-2xl text-center animate-slide-up">
            <h2 class="text-2xl font-black text-white mb-1">Application Submitted!</h2>
            <p class="text-slate-400 text-xs mb-4">Your Tracking ID is: <strong class="font-mono text-brand-teal text-base">${app.trackingId}</strong></p>
            <p class="text-[11px] text-amber-400 mb-6">Status: <strong>Under Review</strong>. Official Member ID will be issued after state approval.</p>
            <button onclick="window.closeModal()" class="w-full py-3 bg-brand-teal text-brand-black font-black rounded-xl text-xs">Done</button>
          </div>
        </div>
      `;
    };

    window.openMemberModal = function(id) {
      const m = window.state.members.find(x => x.id === id);
      if (!m) return;
      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
          <div class="relative w-full max-w-xl bg-brand-dark border border-brand-border rounded-3xl p-6 shadow-2xl animate-slide-up">
            <button onclick="window.closeModal()" class="absolute top-4 right-4 p-2 bg-brand-card rounded-full text-slate-400 hover:text-white">✕</button>
            <div class="flex flex-col sm:flex-row gap-6 items-center sm:items-start">
              <div class="w-40 aspect-[4/5] rounded-2xl overflow-hidden flex-shrink-0 border-2 border-brand-teal">
                ${m.photoUrl ? `<img src="${m.photoUrl}" alt="${m.name}" class="w-full h-full object-cover object-top" />` : window.getDefaultAvatarHtml(m.name, 'Male', 'w-full h-full')}
              </div>
              <div class="flex-1 text-center sm:text-left">
                <span class="text-brand-gold text-[10px] font-black uppercase tracking-widest">${m.badge}</span>
                <h3 class="text-2xl font-black text-white mt-0.5">${m.name}</h3>
                <p class="text-brand-teal text-xs font-bold mb-3">${m.role}</p>
                <p class="text-xs text-slate-400 mb-4 font-mono">ID: ${m.memberId} • District: ${m.district}</p>
                <div class="bg-brand-card p-3.5 rounded-xl text-xs text-slate-300 leading-relaxed border border-brand-border">${m.bio}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    };

    // Initialize State
    window.saveState();
  </script>
